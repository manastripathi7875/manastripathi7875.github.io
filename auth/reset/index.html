<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genstrok — Reset ready</title></head>
<body style="font-family:sans-serif;text-align:center;padding:48px;background:#050914;color:#F5F7FF">
<h2>✅ Link ready hai!</h2>
<p>Ab Genstrok app mein jao aur apna naya password set karo.</p>
<p><a id="open" href="#" style="display:inline-block;margin-top:16px;padding:14px 32px;background:#6C2BFF;color:#fff;border-radius:12px;text-decoration:none;font-weight:bold">Open Genstrok App</a></p>
<script>
var suffix = window.location.search + window.location.hash;
var target = 'genstrok://reset' + suffix;
document.getElementById('open').href = target;
window.location.replace(target);
</script>
</body></html>
